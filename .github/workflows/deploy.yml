name: Deploy React Apps

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- Dengue-Pan 빌드 ---
      - name: Install and Build Dengue-Pan
        run: |
          cd Dengue-Pan
          npm install
          npm run build

      # --- Dengue-Pamphlet 빌드 ---
      - name: Install and Build Dengue-Pamphlet
        run: |
          cd Dengue-Pamphlet
          npm install
          npm run build

      # --- 결과물 폴더 구조 맞추기 ---
      - name: Prepare Public Directory
        run: |
          mkdir -p public_html/Dengue-Pan
          mkdir -p public_html/Dengue-Pamphlet
          cp -r Dengue-Pan/dist/* public_html/Dengue-Pan/
          cp -r Dengue-Pamphlet/dist/* public_html/Dengue-Pamphlet/

      # --- GitHub Pages에 최종 배포 ---
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_html
          keep_files: false